# Yell Design System — Default Configuration
# Users can override by providing their own design_config.yml

# Brand colors
brand:
  primary: "#FF8A3D"        # Yell orange
  primaryHover: "#E6752D"
  secondary: "#3B82F6"      # Blue accent
  success: "#34D399"        # Green
  warning: "#FBBF24"        # Yellow
  danger: "#EF4444"         # Red
  info: "#60A5FA"           # Light blue

# Surface / Background
surface:
  bg: "#0A0A0F"             # Page background (dark mode)
  surface: "#12121A"        # Card/container background
  surface2: "#18182A"       # Elevated surface
  surface3: "#1E1E2E"      # Highest elevation
  border: "#1E1E2E"         # Default border
  borderHover: "#2E2E3E"    # Hover border

# Text
text:
  primary: "#E4E4EF"         # Main text
  muted: "#6B6B8A"          # Secondary/muted text
  placeholder: "#4B4B6A"    # Input placeholders
  inverse: "#0A0A0F"        # Text on light backgrounds

# Typography
typography:
  fontSans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  fontMono: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace"
  fontSize:
    xs: "0.75rem"           # 12px
    sm: "0.875rem"          # 14px
    base: "1rem"            # 16px
    lg: "1.125rem"          # 18px
    xl: "1.25rem"           # 20px
    2xl: "1.5rem"           # 24px
    3xl: "1.875rem"         # 30px
    4xl: "2.25rem"          # 36px
  fontWeight:
    normal: "400"
    medium: "500"
    semibold: "600"
    bold: "700"
    extrabold: "800"
  lineHeight:
    tight: "1.25"
    snug: "1.375"
    normal: "1.6"
    relaxed: "1.75"

# Spacing
spacing:
  0: "0"
  1: "4px"
  2: "8px"
  3: "12px"
  4: "16px"
  5: "20px"
  6: "24px"
  8: "32px"
  10: "40px"
  12: "48px"
  16: "64px"

# Border radius
radius:
  none: "0"
  sm: "4px"
  md: "8px"
  lg: "12px"
  xl: "16px"
  full: "9999px"

# Shadows
shadow:
  sm: "0 1px 2px rgba(0,0,0,0.4)"
  md: "0 4px 6px rgba(0,0,0,0.4)"
  lg: "0 10px 15px rgba(0,0,0,0.5)"
  xl: "0 20px 25px rgba(0,0,0,0.5)"
  inner: "inset 0 2px 4px rgba(0,0,0,0.3)"

# Animation
animation:
  duration:
    fast: "150ms"
    normal: "250ms"
    slow: "400ms"
  easing:
    default: "ease-in-out"
    in: "ease-out"
    out: "ease-in"
    bounce: "cubic-bezier(0.68, -0.55, 0.265, 1.55)"

# Z-index scale
zIndex:
  dropdown: "100"
  sticky: "200"
  modal: "300"
  toast: "400"
  tooltip: "500"

# Component-specific tokens
components:
  button:
    paddingX: "spacing.4"
    paddingY: "spacing.2"
    fontSize: "typography.fontSize.sm"
    fontWeight: "typography.fontWeight.semibold"
    borderRadius: "radius.md"
  input:
    paddingX: "spacing.3"
    paddingY: "spacing.2"
    fontSize: "typography.fontSize.base"
    borderRadius: "radius.md"
    borderColor: "surface.border"
    borderColorHover: "surface.borderHover"
  card:
    padding: "spacing.4"
    borderRadius: "radius.lg"
    background: "surface.surface"
    borderWidth: "1px"
    borderColor: "surface.border"
