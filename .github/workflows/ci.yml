name: CI

on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main, gh-pages]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run --workspaces build

      - name: Run tests
        run: bun run --workspaces test
